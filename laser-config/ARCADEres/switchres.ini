# switchres.ini - TV CRT 15 kHz (referencia de geometria)
# Por ahora el script usa crt_switch_resolution = 1 (monitor arcade_15).
# Para usar esta geometria: copiar a /recalbox/share/system/.config/retroarch/config/switchres.ini
# y cambiar crt_switch_resolution a 17 (INI).
#
# Geometria del crt_range (tiempos en us):
#   HBackPorch  -> POSICION: mas chico = imagen mas a la izquierda (y un poco mas ancha)
#   HFrontPorch -> ANCHO: mas grande = imagen mas angosta, SIN moverla
#   HSyncPulse  -> no tocar salvo necesidad (4.700 = NTSC)

monitor                   custom
crt_range0                15625-15750, 59.50-60.50, 3.000, 4.700, 4.700, 0.191, 0.191, 0.953, 0, 0, 192, 240, 448, 480
crt_range1                auto
crt_range2                auto
crt_range3                auto
crt_range4                auto
crt_range5                auto
crt_range6                auto
crt_range7                auto
crt_range8                auto
crt_range9                auto
lcd_range                 auto
modeline                  auto
user_mode                 auto

display                   auto
api                       auto
lock_unsupported_modes    1
lock_system_modes         0
refresh_dont_care         0
keep_changes              0

modeline_generation       1
interlace                 1
doublescan                0

# CRITICO en Linux/Pi: evita modos con dotclock bajisimo (6-13 MHz) que el
# HDMI del Pi no puede emitir (era la causa de la distorsion y el chillido).
dotclock_min              25.0

sync_refresh_tolerance    2.0
super_width               2560
aspect                    4:3
v_shift_correct           0

# Calibracion de referencia (equivalente a Horizontal Size -30 / Centering -20)
h_size                    0.7
h_shift                   -20
v_shift                   0

pixel_precision           1
interlace_force_even      0
scale_proportional        1

screen_compositing        0
screen_reordering         0
allow_hardware_refresh    0
custom_timing             auto

verbosity                 0
monitor_connector         auto
